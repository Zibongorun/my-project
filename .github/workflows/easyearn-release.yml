name: EasyEarn Signed AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android source
        run: |
          mkdir -p android-build
          unzip -q easyearn-android-source.zip -d android-build
          chmod +x android-build/gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android-build/local.properties
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload signing key
        env:
          KEY_B64: ${{ secrets.EE_KEYSTORE_BASE64 }}
          EE_STORE_PASSWORD: ${{ secrets.EE_STORE_PASSWORD }}
          EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}
          EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
        run: |
          test -n "$KEY_B64" && test -n "$EE_STORE_PASSWORD" && test -n "$EE_KEY_PASSWORD" && test -n "$EE_KEY_ALIAS"
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/easyearn-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/easyearn-upload.jks" -storepass:env EE_STORE_PASSWORD -alias "$EE_KEY_ALIAS" > /dev/null

      - name: Build signed bundle
        working-directory: android-build
        env:
          EE_KEYSTORE: ${{ runner.temp }}/easyearn-upload.jks
          EE_STORE_PASSWORD: ${{ secrets.EE_STORE_PASSWORD }}
          EE_KEY_PASSWORD: ${{ secrets.EE_KEY_PASSWORD }}
          EE_KEY_ALIAS: ${{ secrets.EE_KEY_ALIAS }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify bundle signature
        run: |
          test -s android-build/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android-build/app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PYVERIFY'
          import zipfile
          p = 'android-build/app/build/outputs/bundle/release/app-release.aab'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert any(
                  n.startswith('META-INF/') and n.endswith('.RSA')
                  for n in z.namelist()
              ), 'Unsigned AAB'
          PYVERIFY

      - name: Downloadable Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: EasyEarn-1.2.5-Signed-AAB
          path: android-build/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/easyearn-upload.jks"
